plugins { id 'com.android.application' }

android {
    namespace 'com.amzstudios.cofre'
    compileSdk 34
    defaultConfig {
        applicationId 'com.amzstudios.cofre'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('COFRE_KEYSTORE')) {
                storeFile file(System.getenv('COFRE_KEYSTORE'))
                storePassword System.getenv('COFRE_STORE_PASSWORD')
                keyAlias 'cofre-amz'
                keyPassword System.getenv('COFRE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
